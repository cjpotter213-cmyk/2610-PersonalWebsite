<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carson Potter</title>
    <link rel="stylesheet" href="./Styles/navbar.css" />
    <link rel="stylesheet" href="./Styles/standard.css" />
  </head>
  <body>
    <header id="navbar">
      <h1>Carson Potter</h1>
      <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </header>
    <main>
      <div id="contactInfo">
        <div id="contactHead">
          <h1>Contact Me!</h1>
          <p>Please fill out the below information to connect with me!</p>
        </div>
        <img
          id="contactIMG"
          src="./images/carsonflancrop.jpg"
          alt="CarsonPotter.img"
        />
        <form>
          <div>
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="fullName" required />
          </div>
          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="user-email" required />
          </div>
          <div>
            <label for="message">Message</label>
            <textarea
              type="text"
              id="message"
              name="user-message"
              rows="2"
            ></textarea>
          </div>
          <div>
            <button id="submit" type="submit">Submit</button>
          </div>
        </form>
      </div>
    </main>
    <footer>CARSON POTTER</footer>
  </body>
</html>
